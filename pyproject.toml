[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safegrip-open"
version = "0.3.1"
description = "Open-data benchmark for physics-constrained partial identification of tire-road friction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.4",
  "matplotlib>=3.8", "requests>=2.31", "beautifulsoup4>=4.12",
  "pyyaml>=6.0", "torch>=2.2", "tqdm>=4.66", "joblib>=1.3", "openpyxl>=3.1"
]

[project.optional-dependencies]
paper = ["gpytorch>=1.12", "optuna>=3.6"]
dev = ["pytest>=8.0"]

[project.scripts]
safegrip = "safegrip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
